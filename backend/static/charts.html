<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light" />
        
        <title>Mantis Shot Saver</title>
        <link rel="icon" type="image/png" href="/img/icon.png">

        <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.grey.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

        <script src="/js/charts.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
        <link rel="stylesheet" href="/css/custom.css" />

    </head>
    <body data-theme="dark">
        <div x-data="init()" x-init="loadList" data-theme="light" class="container">
            <nav data-theme="dark">
                <ul>
                    <li><img height="32" src="/img/icon.png" style="height: 32px !important;" /></li>
                </ul>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/charts.html">Charts</a></li>
                </ul>
            </nav>

            <article class="container-fluid" data-theme="light">
                <h1>Mantis Shot Saver</h1>

                <article>
                    <h2>Shots Over Time</h2>
                    <div id="chart"></div>
                </article>

                <article>
                    <h2>Session Scores</h2>
                    <div id="candlestick-chart"></div>
                </article>

                <article class="grid">
                    <div id="gauge-chart"></div>
                    <div id="time-gauge-chart"></div>
                </article>

            </article>
        </div>
    </body>
</html>
