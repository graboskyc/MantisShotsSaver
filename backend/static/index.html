<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light" />
        
        <title>Mantis Shot Saver</title>
        <link rel="icon" type="image/png" href="/img/icon.png">

        <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.grey.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

        <script src="/js/init.js"></script>
        <link rel="stylesheet" href="/css/custom.css" />

    </head>
    <body data-theme="dark">
        <div x-data="init()" x-init="loadList" data-theme="light" class="container">
            <nav data-theme="dark">
                <ul>
                    <li><img height="32" src="/img/icon.png" style="height: 32px !important;" /></li>
                </ul>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/charts.html">Charts</a></li>
                </ul>
            </nav>


            <article class="container-fluid" data-theme="light">
                <h1>Mantis Shot Saver</h1>
            </article>
            
            <article>
                <header>
                    <div x-show="currentSession">
                        <h2 x-text="currentSession.drill_name"></h2>
                        <h3 x-text="new Date(currentSession.date.$date).toLocaleString()"></h3>
                        <div class="img-container">
                            <div class="img-wrapper">
                                <img :src="currentSession.image" alt="Session Image">
                                <template x-for="shot in currentSession.shots" :key="shot.Index">
                                    <div style="position: absolute;" :style="{ left: (shot['Position X'] * 100) + '%', top: (shot['Position Y'] * 100) + '%' }">
                                        <div style="width: 20px; height: 20px; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; transform: translate(-50%, -50%); cursor: pointer;"
                                             :style="{ background: shot.Score === 0 ? 'black' : 'red' }"
                                             x-text="shot.Index">
                                        </div>
                                        <div class="shot-label"
                                             x-text="shot['Time'].toFixed(2)">
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                    <div x-show="!currentSession">Loading...</div>
                </header>

                <footer class="nav-footer">
                    <div class="grid" style="margin:.5rem;">
                        <button @click="prevSession" :disabled="skip === 0 && currentIndex === 0">
                            <span class="material-symbols-outlined">
                                skip_previous
                            </span>
                        </button>
                        <button @click="nextSession">
                            <span class="material-symbols-outlined">
                                skip_next
                            </span>
                        </button>
                    </div>

                    <div class="grid" style="margin:.5rem;">
                        <button @click="importLastDay" :disabled="importing" style="width: 100%;">
                            <span x-show="!importing">Import Today's Data</span>
                            <span x-show="importing" aria-busy="true">Importing...</span>
                        </button>
                    </div>
                    
                </footer>
            </article> 
    </body>
</html>
